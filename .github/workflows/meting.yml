# SLIMBOT-BUITENMETING-MEETPUNT-20261109
# Meting van buitenaf voor https://slimbot.nl/status.
# Elke 5 minuten een geplande run (wacht als er al een loopt); elke run meet 10 keer met een minuut ertussen en zet de uitkomst in data/.
# Geplande runs starten vaak laat of niet. Daarom start elke run aan het eind zelf de volgende (stap 'volgende run'),
# zodat de meting ook doorloopt als ons platform helemaal weg is. De Slimbot-server start alleen een run als er geen loopt of wacht.
# De Slimbot-server haalt data/ zelf op (git fetch). Er gaat niets van hier naar de server toe.
name: meting
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: meting
  cancel-in-progress: false
jobs:
  meet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: meten
        env:
          LIVECHAT_URL: ${{ secrets.LIVECHAT_URL }}
        run: bash meet.sh
      - name: opslaan
        run: |
          git config user.name 'meting'
          git config user.email 'meting@users.noreply.github.com'
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "meting $(date -u +%FT%TZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
      - name: volgende run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow meting.yml --limit 10 --json status --jq '[.[]|select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")]|length' || echo 1)
          if [ "$n" = "0" ]; then gh workflow run meting.yml --repo "$GITHUB_REPOSITORY" --ref main; fi
